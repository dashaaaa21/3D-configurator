<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ORION</title>
        <link href="/src/styles/main.css" rel="stylesheet">
    </head>
    <body>
        <canvas class="canvas"></canvas>
        
        <button class="ai-chat-toggle-btn" id="ai-chat-btn" title="Open AI Assistant">AI</button>
        
        <div class="ai-chat-container" id="ai-chat-container">
            <div class="ai-chat-header">
                <h3>AI Design Assistant</h3>
                <button class="ai-chat-close" id="ai-chat-close">&times;</button>
            </div>
            <div class="ai-chat-messages" id="ai-messages"></div>
            <div class="ai-chat-input-container">
                <input 
                    type="text" 
                    class="ai-chat-input" 
                    id="ai-input" 
                    placeholder="Describe the color or style you like..."
                />
                <button class="ai-chat-send" id="ai-send">Send</button>
            </div>
            <div class="ai-chat-loading hidden" id="ai-loading">
                <div class="loading-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>
    </body>
</html>
