name: Render Deploy

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Render
        run: |
          echo "Deploying to Render..."
          echo "Service ID: srv-d5htj475r7bs73bmh080"
          echo "URL: https://threed-configurator-qrxl.onrender.com"
          
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Deploy triggered successfully"
          else
            echo "RENDER_DEPLOY_HOOK_URL not set. Skipping deploy."
            echo "Get deploy hook from: https://dashboard.render.com/web/srv-d5htj475r7bs73bmh080"
          fi
